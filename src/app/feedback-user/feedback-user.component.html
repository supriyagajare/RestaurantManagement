<div class="container">
    <h2>Add Feedback</h2>
    <form (submit)="addFeedback()">
      <div class="form-group">
        <label for="ratings">Ratings:</label>
        <input type="number" [(ngModel)]="feedback.ratings" name="ratings" id="ratings" min="1" max="5" required>
      </div>
      <div class="form-group">
        <label for="overAllRating">Overall Rating:</label>
        <input type="number" [(ngModel)]="feedback.overAllRating" name="overAllRating" id="overAllRating" min="1" max="5" required>
      </div>
      <div class="form-group">
        <label for="message">Message:</label>
        <textarea [(ngModel)]="feedback.message" name="message" id="message" rows="4" required></textarea>
      </div>
      <button type="submit" class="btn btn-primary">Submit Feedback</button>
    </form>
  </div>
